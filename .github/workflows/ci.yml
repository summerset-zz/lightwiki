# 每次 push / PR 都验证：类型、内容校验、构建。
# 语法手册（tests/mini）就是回归测试 —— 它构建失败说明语法坏了。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn 4：corepack 会按 packageManager 字段装对应版本，不需要全局安装
      - run: corepack enable

      - run: yarn install --immutable

      - name: 类型检查
        run: yarn type:check

      - name: 校验语法回归测试
        run: yarn wiki check tests/mini --strict

      - name: 构建语法回归测试
        run: yarn wiki build tests/mini

      # 主站文档自己也得能过校验（不加 --strict：文档里允许有还没写的页）
      - name: 校验主站文档
        run: yarn wiki check site
