# 把语法手册发到 GitHub Pages，当在线 demo。
#
# 项目站点的地址是 `https://<owner>.github.io/<repo>/`，所以要用环境变量告诉站点
# 「我挂在子路径下」—— 否则产物里的链接会指向根目录。
# 首次运行前要在仓库 Settings → Pages 里把 Source 设成 "GitHub Actions"。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable

      # 暂时仍发布 tests/mini（语法回归测试）：主站 site/ 还在建设，只有占位首页。
      # 主站文档写完（「开始 / 基础 / 高级」三组齐了）之后，把这两处 tests/mini 换成 site。
      - name: 构建语法回归测试
        env:
          LIGHTWIKI_BASE_PATH: /${{ github.event.repository.name }}/
          LIGHTWIKI_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: yarn wiki build tests/mini

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tests/mini/dist
      - id: deployment
        uses: actions/deploy-pages@v4
