# 把语法手册发到 GitHub Pages，当在线 demo。
#
# 项目站点的地址是 `https://<owner>.github.io/<repo>/`，所以要用环境变量告诉站点
# 「我挂在子路径下」—— 否则产物里的链接会指向根目录。
# 首次运行前要在仓库 Settings → Pages 里把 Source 设成 "GitHub Actions"。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable

      - name: 构建语法手册
        env:
          LIGHTWIKI_BASE_PATH: /${{ github.event.repository.name }}/
          LIGHTWIKI_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: yarn wiki build examples/mini

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/mini/dist
      - id: deployment
        uses: actions/deploy-pages@v4
